<div>
  <h2 id="page-heading" data-cy="TravelReportHeading">
    <span jhiTranslate="hikesApp.travelReport.home.title">Travel Reports</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="hikesApp.travelReport.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        *jhiHasAnyAuthority="'ROLE_USER'"
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-travel-report"
        [routerLink]="['/travel-report/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="hikesApp.travelReport.home.createLabel"> Create a new Travel Report </span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <jhi-filter [filters]="filters"></jhi-filter>

  <div class="alert alert-warning" id="no-result" *ngIf="travelReports?.length === 0">
    <span jhiTranslate="hikesApp.travelReport.home.notFound">No Travel Reports found</span>
  </div>

  <div *ngIf="travelReports && travelReports.length > 0">
    <div class="d-flex justify-content-center">
      <jhi-item-count [params]="{ page: page, totalItems: totalItems, itemsPerPage: itemsPerPage }"></jhi-item-count>
    </div>

    <div class="d-flex justify-content-center">
      <ngb-pagination
        [collectionSize]="totalItems"
        [page]="page"
        [pageSize]="itemsPerPage"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="navigateToPage($event)"
      ></ngb-pagination>
    </div>
